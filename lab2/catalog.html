<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог | CandleCraft</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header id="main-header">
        <div class="logo">CandleCraft</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="delivery.html">Доставка</a>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Наш каталог</h1>
        <p class="page-subtitle">Выберите свечу по настроению</p>

        <div class="product-grid">
            <div class="product-card">
                <img src="images/candle1.jpg" alt="Свеча с ароматом ванили - Десерт">
                <h3>Десерт</h3>
                <p class="price">500 руб.</p>
                <button class="buy-btn">Купить</button>
            </div>
            <div class="product-card">
                <img src="images/candle2.jpg" alt="Свеча с ароматом шалфея - Сухоцветы">
                <h3>Сухоцветы</h3>
                <p class="price">600 руб.</p>
                <button class="buy-btn">Купить</button>
            </div>
            <div class="product-card">
                <img src="images/candle3.jpg" alt="Свеча с ароматом бергамота и морской соли - Морской бриз">
                <h3>Морской бриз</h3>
                <p class="price">550 руб.</p>
                <button class="buy-btn">Купить</button>
            </div>
            <div class="product-card">
                <img src="images/candle4.jpg" alt="Свеча с ароматом лаванды - Лаванда">
                <h3>Лавада</h3>
                <p class="price">520 руб.</p>
                <button class="buy-btn">Купить</button>
            </div>
        </div>
    </main>

    <footer>
        <p>2026 CandleCraft. Дарим тепло  /ᐠ｡ꞈ｡ᐟ\.</p>
    </footer>

</body>
</html>
